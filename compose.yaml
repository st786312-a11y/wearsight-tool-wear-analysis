services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    build:
      context: ./backend
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      DIFY_API_URL: ${DIFY_API_URL:-http://host.docker.internal/v1}
      DIFY_API_KEY: ${DIFY_API_KEY:-}
      DIFY_ANALYSIS_URL_BASE: ${DIFY_ANALYSIS_URL_BASE:-http://host.docker.internal:8000}
      DIFY_TIMEOUT: ${DIFY_TIMEOUT:-120}
      YOLO_MODEL_PATH: /app/yolo/keypoint-best.pt
      HF_HOME: /models/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      DINOV3_MODEL_PATH: ${DINOV3_MODEL_PATH:-}
      DINOV2_MODEL_PATH: ${DINOV2_MODEL_PATH:-}
      HF_HUB_ETAG_TIMEOUT: "10"
      HF_HUB_DOWNLOAD_TIMEOUT: "30"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/yolo:ro
      - clip-model-cache:/models
    expose:
      - "8000"
    ports:
      - "8000:8000"

volumes:
  clip-model-cache:
